name: 🔄 Sync Labels Between PR and Linked Issue

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited]
  issues:
    types: [labeled, unlabeled, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Bi-directional Label Sync
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueRegex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;

            async function syncLabels(sourceLabels, targetNumber, isTargetIssue) {
              let targetLabels = [];
              try {
                if (isTargetIssue) {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: targetNumber
                  });
                  targetLabels = issue.labels.map(l => l.name);
                } else {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: targetNumber
                  });
                  targetLabels = pr.labels.map(l => l.name);
                }
              } catch (e) {
                console.error(`Could not fetch target ${targetNumber}`, e);
                return;
              }

              const toAdd = sourceLabels.filter(l => !targetLabels.includes(l));
              const toRemove = targetLabels.filter(l => !sourceLabels.includes(l));

              if (toAdd.length > 0) {
                console.log(`Adding labels [${toAdd.join(', ')}] to #${targetNumber}`);
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: targetNumber,
                  labels: toAdd
                });
              }

              for (const label of toRemove) {
                console.log(`Removing label "${label}" from #${targetNumber}`);
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: targetNumber,
                    name: label
                  });
                } catch (e) {
                  console.error(`Failed to remove label ${label} from #${targetNumber}`, e);
                }
              }
            }

            // Triggered from a Pull Request
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const sourceLabels = pr.labels.map(l => l.name);
              
              let match;
              const linkedIssues = new Set();
              while ((match = issueRegex.exec(pr.body || '')) !== null) {
                linkedIssues.add(parseInt(match[1]));
              }

              for (const issueNumber of linkedIssues) {
                console.log(`Syncing from PR #${pr.number} to Issue #${issueNumber}`);
                await syncLabels(sourceLabels, issueNumber, true);
              }
            } 
            // Triggered from an Issue
            else if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              const sourceLabels = issue.labels.map(l => l.name);
              
              // Find all open PRs
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });

              for (const pr of prs) {
                // Check if this PR's body references the current issue
                let match;
                let linksToIssue = false;
                
                // reset regex index
                const prRegex = new RegExp(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/, 'gi');
                while ((match = prRegex.exec(pr.body || '')) !== null) {
                  if (parseInt(match[1]) === issue.number) {
                    linksToIssue = true;
                    break;
                  }
                }

                if (linksToIssue) {
                  console.log(`Syncing from Issue #${issue.number} to PR #${pr.number}`);
                  await syncLabels(sourceLabels, pr.number, false);
                }
              }
            }
